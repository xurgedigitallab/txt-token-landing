<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT Token Whitepaper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Inter', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* TOP BAR */
    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: #111;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
      gap: 12px;
    }

    #topbar a {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      color: #c084fc;
      text-decoration: none;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }
    #topbar a:hover { color: #e0aaff; }

    #title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.6rem, 2vw, 0.85rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #e0e0e0;
      text-align: center;
      flex: 1;
    }

    #page-counter {
      font-size: 0.75rem;
      color: #888;
      white-space: nowrap;
      min-width: 70px;
      text-align: right;
    }

    /* VIEWER AREA */
    #viewer {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #page-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      transition: opacity 0.2s ease;
    }

    #page-img.fade { opacity: 0; }

    /* SIDE NAV BUTTONS */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.55);
      border: 1px solid #333;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      z-index: 10;
      color: #fff;
    }
    .nav-arrow:hover { background: rgba(138,43,226,0.5); border-color: #9333ea; }
    .nav-arrow.hidden { opacity: 0; pointer-events: none; }
    #btn-prev { left: 12px; }
    #btn-next { right: 12px; }

    /* BOTTOM BAR */
    #bottombar {
      flex-shrink: 0;
      background: #111;
      border-top: 1px solid #222;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* THUMBNAIL STRIP */
    #thumb-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      flex: 1;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
      padding-bottom: 2px;
    }
    #thumb-strip::-webkit-scrollbar { height: 4px; }
    #thumb-strip::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .thumb {
      flex-shrink: 0;
      width: 40px;
      height: 52px;
      object-fit: cover;
      border-radius: 3px;
      border: 2px solid transparent;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.2s, border-color 0.2s;
    }
    .thumb:hover { opacity: 0.8; }
    .thumb.active {
      border-color: #9333ea;
      opacity: 1;
    }

    /* FULLSCREEN BUTTON */
    #btn-fullscreen {
      background: none;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 6px 10px;
      color: #888;
      cursor: pointer;
      font-size: 0.7rem;
      white-space: nowrap;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    #btn-fullscreen:hover { border-color: #9333ea; color: #c084fc; }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div id="topbar">
    <a href="index.html">← Back</a>
    <div id="title">TXT TOKEN WHITEPAPER</div>
    <div id="page-counter">1 / 22</div>
  </div>

  <!-- VIEWER -->
  <div id="viewer">
    <button class="nav-arrow hidden" id="btn-prev" aria-label="Previous page">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>

    <img id="page-img" src="wp/1.png" alt="Whitepaper page 1" draggable="false">

    <button class="nav-arrow" id="btn-next" aria-label="Next page">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <!-- BOTTOM BAR -->
  <div id="bottombar">
    <div id="thumb-strip"></div>
    <button id="btn-fullscreen">⛶ Fullscreen</button>
  </div>

  <script>
    const TOTAL = 22;
    let current = 1;

    const img = document.getElementById('page-img');
    const counter = document.getElementById('page-counter');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const strip = document.getElementById('thumb-strip');
    const btnFs = document.getElementById('btn-fullscreen');

    // Build thumbnails
    for (let i = 1; i <= TOTAL; i++) {
      const t = document.createElement('img');
      t.src = `wp/${i}.png`;
      t.className = 'thumb' + (i === 1 ? ' active' : '');
      t.alt = `Page ${i}`;
      t.dataset.page = i;
      t.addEventListener('click', () => goTo(i));
      strip.appendChild(t);
    }

    function goTo(n, instant = false) {
      if (n < 1 || n > TOTAL || n === current) return;
      current = n;

      if (instant) {
        img.src = `wp/${current}.png`;
        img.alt = `Whitepaper page ${current}`;
      } else {
        img.classList.add('fade');
        setTimeout(() => {
          img.src = `wp/${current}.png`;
          img.alt = `Whitepaper page ${current}`;
          img.classList.remove('fade');
        }, 180);
      }

      counter.textContent = `${current} / ${TOTAL}`;
      btnPrev.classList.toggle('hidden', current === 1);
      btnNext.classList.toggle('hidden', current === TOTAL);

      // Update thumbnails
      document.querySelectorAll('.thumb').forEach(t => {
        t.classList.toggle('active', +t.dataset.page === current);
      });

      // Scroll active thumb into view
      const activeThumb = strip.querySelector('.thumb.active');
      if (activeThumb) activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    btnPrev.addEventListener('click', () => goTo(current - 1));
    btnNext.addEventListener('click', () => goTo(current + 1));

    // Keyboard navigation
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(current + 1);
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   goTo(current - 1);
    });

    // Touch / swipe
    let touchStartX = 0;
    document.getElementById('viewer').addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });
    document.getElementById('viewer').addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 40) dx < 0 ? goTo(current + 1) : goTo(current - 1);
    }, { passive: true });

    // Fullscreen
    btnFs.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
        btnFs.textContent = '✕ Exit Fullscreen';
      } else {
        document.exitFullscreen();
        btnFs.textContent = '⛶ Fullscreen';
      }
    });
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) btnFs.textContent = '⛶ Fullscreen';
    });
  </script>
</body>
</html>
